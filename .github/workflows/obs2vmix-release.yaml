name: obs2vmix release
run-name: obs2vmix release ${{ inputs.tag }} 🛫
# Publishes an already-built obs2vmix as a GitHub Release.
# It does not compile anything itself: it takes the packages a green "obs2vmix branch build"
# (or master push) run produced, renames them, and attaches them to a release under the tag
# you give. So nothing ships that the branch build did not pass. Since 14.9.2026 a release
# holds only the two macOS DMGs (Apple Silicon, Intel), whatever else the run produced.
#   gh workflow run obs2vmix-release.yaml --ref obs2vmix/seam -f tag=obs2vmix-0.2.0
# run_id may be left empty: the newest successful build of the ref you dispatched from is used.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag / version for the release (created at the built commit if it does not exist)
        required: true
        type: string
      run_id:
        description: Workflow run id whose artifacts to publish (empty = latest successful build of this ref)
        required: false
        type: string
      prerelease:
        description: Mark the release as a pre-release
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
jobs:
  create-release:
    name: Create Release 🛫
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Find Build Run 🔎
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          : Find Build Run 🔎
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          run_id="${INPUT_RUN_ID}"
          if [[ -z "${run_id}" ]]; then
            run_id="$(gh run list --branch "${GITHUB_REF_NAME}" --status success --limit 50 \
              --json databaseId,workflowName \
              --jq '[.[] | select(.workflowName == "obs2vmix branch build" or .workflowName == "Push")] | first | .databaseId')"
          fi
          if [[ -z "${run_id}" || "${run_id}" == "null" ]]; then
            echo "::error::No successful build run found for ${GITHUB_REF_NAME}; pass run_id explicitly."
            exit 1
          fi

          head_sha="$(gh run view "${run_id}" --json headSha --jq .headSha)"
          echo "runId=${run_id}" >> $GITHUB_OUTPUT
          echo "headSha=${head_sha}" >> $GITHUB_OUTPUT
          echo "commitHash=${head_sha:0:9}" >> $GITHUB_OUTPUT
          echo "Publishing artifacts of run ${run_id} (commit ${head_sha}) as ${{ inputs.tag }}"

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ steps.run.outputs.runId }}
          github-token: ${{ github.token }}
          path: ${{ github.workspace }}/artifacts

      - name: Rename Files 🏷️
        id: rename
        env:
          VERSION: ${{ inputs.tag }}
        run: |
          : Rename Files 🏷️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s nullglob globstar

          out="${GITHUB_WORKSPACE}/release"
          mkdir -p "${out}"
          cd "${GITHUB_WORKSPACE}/artifacts"

          echo '::group::Downloaded artifacts'
          find . -type f | sort
          echo '::endgroup::'

          take() {
            # take <destination name> <glob...>: first match wins, missing is not an error
            local dest="$1"; shift
            local f
            for f in "$@"; do
              [[ -f "${f}" ]] || continue   # the artifact folder can carry the same name as the file inside it
              mv -v "${f}" "${out}/${dest}"
              return
            done
            echo "::warning::No file for ${dest}"
          }

          echo '::group::Renaming'
          # macOS only since 14.9.2026 (Marko: "other releases don't release for now");
          # the other lines are kept for the day they come back.
          take "OBS2vMix-${VERSION}-macOS-Apple.dmg"          **/obs-studio-*-macos-apple.dmg
          take "OBS2vMix-${VERSION}-macOS-Intel.dmg"          **/obs-studio-*-macos-intel.dmg
          # take "OBS2vMix-${VERSION}-Windows-x64.zip"          **/obs-studio-*-windows-x64.zip
          # take "OBS2vMix-${VERSION}-Windows-arm64.zip"        **/obs-studio-*-windows-arm64.zip
          # take "OBS2vMix-${VERSION}-macOS-Apple-dSYMs.tar.xz" **/obs-studio-*-macos-apple-dSYMs.tar.xz
          # take "OBS2vMix-${VERSION}-macOS-Intel-dSYMs.tar.xz" **/obs-studio-*-macos-intel-dSYMs.tar.xz
          # take "OBS2vMix-${VERSION}-Ubuntu-26.04-x86_64.deb"  **/obs-studio-*-x86_64-ubuntu-gnu.deb
          # take "OBS2vMix-${VERSION}-Ubuntu-26.04-x86_64-dbgsym.ddeb" **/obs-studio-*-x86_64-ubuntu-gnu-dbgsym.ddeb
          # take "OBS2vMix-${VERSION}-Linux-x86_64.flatpak"     **/*.flatpak
          # take "OBS2vMix-${VERSION}-Sources.tar.gz"           **/obs-studio-*-sources.tar.gz
          echo '::endgroup::'

          ls -la "${out}"
          if [[ -z "$(ls -A "${out}")" ]]; then
            echo "::error::Nothing to release - the build run has no package artifacts."
            exit 1
          fi

      - name: Write Release Notes 📝
        env:
          VERSION: ${{ inputs.tag }}
          RUN_ID: ${{ steps.run.outputs.runId }}
          HEAD_SHA: ${{ steps.run.outputs.headSha }}
        run: |
          : Write Release Notes 📝
          cd "${GITHUB_WORKSPACE}/release"
          notes="${GITHUB_WORKSPACE}/NOTES.md"
          {
            echo "OBS2vMix: OBS Studio with a vision-mixer face and no text: Source and Final, five thumbnails, every action on the right mouse button."
            echo
            echo "Built by GitHub Actions run [${RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}) from commit ${HEAD_SHA}."
            echo
            echo "| Platform | File |"
            echo "|---|---|"
            for f in *; do
              case "${f}" in
                *Windows-x64.zip)   echo "| Windows 10/11 x64 (portable, unzip and run bin/64bit/obs64.exe) | ${f} |" ;;
                *Windows-arm64.zip) echo "| Windows on ARM (portable) | ${f} |" ;;
                *macOS-Apple.dmg)   echo "| macOS, Apple Silicon | ${f} |" ;;
                *macOS-Intel.dmg)   echo "| macOS, Intel | ${f} |" ;;
                *.deb)              echo "| Ubuntu 26.04 x86_64 | ${f} |" ;;
                *.flatpak)          echo "| Linux (any distro, Flatpak bundle: flatpak install ./${f}) | ${f} |" ;;
                *.ddeb|*dSYMs*)     echo "| Debug symbols | ${f} |" ;;
                *Sources.tar.gz)    echo "| Source code | ${f} |" ;;
              esac
            done
            echo
            echo "The builds are not code-signed. On macOS, right-click the app and choose Open the first time"
            echo "(or run: xattr -dr com.apple.quarantine /Applications/OBS2vMix.app). On Windows, choose"
            echo "\"More info\" then \"Run anyway\" in SmartScreen."
            echo
            echo "### Checksums"
            for f in *; do
              echo "    ${f}: $(sha256sum "${f}" | cut -d ' ' -f 1)"
            done
          } > "${notes}"
          cat "${notes}"

      - name: Create Release 🛫
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          draft: false
          prerelease: ${{ inputs.prerelease }}
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ steps.run.outputs.headSha }}
          name: obs2vmix ${{ inputs.tag }}
          body_path: ${{ github.workspace }}/NOTES.md
          fail_on_unmatched_files: true
          files: ${{ github.workspace }}/release/*

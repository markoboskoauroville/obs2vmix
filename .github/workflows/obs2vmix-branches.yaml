name: obs2vmix branch build
run-name: ${{ github.ref_name }} obs2vmix build 🎛️
# master is built by push.yaml (upstream OBS workflow, produces DMG / Windows / Ubuntu packages).
# This one builds our feature branches, so nothing merges to master unbuilt.
# Since 14.9.2026 only the Apple Silicon DMG: Marko, "focus only on building macOS DMG, other
# releases don't release for now ... this is Apple Silicon M1, adjust all builds to my computer"
# (MacBook Pro 18,3, M1 Pro; MANTRA_MANIFEST modules/the-machine.md). platforms: all brings
# the rest back.
on:
  push:
    branches:
      - 'obs2vmix/**'
    paths-ignore:
      - '**.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-project:
    name: Build 🧱
    uses: ./.github/workflows/build-project.yaml
    with:
      platforms: macos
    secrets: inherit
